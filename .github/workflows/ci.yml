name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config mingw-w64
      - run: cargo test --release
      - run: cargo build --release
      - run: cargo build --release --target x86_64-pc-windows-gnu

      - name: pack
        run: |
          strip target/release/bitbybeat
          mkdir -p dist/linux dist/win-gnu
          cp target/release/bitbybeat README.md LICENSE dist/linux/
          cp target/x86_64-pc-windows-gnu/release/bitbybeat.exe README.md LICENSE dist/win-gnu/

      - uses: actions/upload-artifact@v4
        with:
          name: bitbybeat-linux-x64
          path: dist/linux/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: bitbybeat-windows-gnu-x64
          path: dist/win-gnu/
          if-no-files-found: error
          retention-days: 14

  # Кросс-сборка выше проверяет только компиляцию под Windows. Код захвата системного
  # вывода (WASAPI loopback) специфичен для этой платформы, поэтому тесты гоняем и здесь.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release

      - name: pack
        shell: bash
        run: |
          mkdir -p dist/win
          cp target/release/bitbybeat.exe README.md LICENSE dist/win/

      - uses: actions/upload-artifact@v4
        with:
          name: bitbybeat-windows-x64
          path: dist/win/
          if-no-files-found: error
          retention-days: 14
