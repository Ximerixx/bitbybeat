# git tag v0.1.0 && git push origin v0.1.0
# линух нативно, винда кроссом mingw с того же раннера
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config mingw-w64
      - run: cargo test --release
      - run: cargo build --release
      - run: cargo build --release --target x86_64-pc-windows-gnu

      - name: pack
        run: |
          strip target/release/bitbybeat
          mkdir -p dist/linux dist/win
          cp target/release/bitbybeat dist/linux/
          cp README.md dist/linux/
          cp target/x86_64-pc-windows-gnu/release/bitbybeat.exe dist/win/
          cp README.md dist/win/
          python3 -c "import shutil; shutil.make_archive('bitbybeat-linux-x64', 'zip', 'dist/linux'); shutil.make_archive('bitbybeat-windows-x64', 'zip', 'dist/win')"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bitbybeat-linux-x64.zip
            bitbybeat-windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
