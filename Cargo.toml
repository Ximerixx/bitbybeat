[package]
name = "bitbybeat"
version = "0.1.0"
edition = "2021"
description = "Конфигурируемый аудиоанализатор → OSC (порт TouchDesigner-прототипа Analysis 2.2)."
license = "MIT"

[dependencies]
# GUI
eframe = { version = "0.29", default-features = true }
egui = "0.29"
egui_plot = "0.29"

# Аудио I/O (приоритет — устройства, в т.ч. monitor-источники; см. md_plans/10 R6)
cpal = "0.15"

# DSP
realfft = "3"

# Lock-free передача сэмплов audio-callback → worker
ringbuf = "0.4"

# OSC :7700
rosc = "0.10"

# Конфиг/пресеты
serde = { version = "1", features = ["derive"] }
ron = "0.8"

anyhow = "1"

[features]
default = []
# Файловый вход — низкий приоритет (тяжёлые декодеры), см. md_plans/10 R6
file-input = []

[profile.release]
opt-level = 3
lto = "thin"
